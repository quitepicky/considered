name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to publish, e.g. v0.1.11"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows-package:
    uses: ./.github/workflows/windows-package.yml
    with:
      ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  release:
    needs: windows-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo '::error::Use a v-prefixed semantic version tag.'
            exit 1
          fi
      # Recovery fixes come from the protected workflow commit, while binaries
      # always build from the original immutable release tag below.
      - name: Check out trusted publication controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve publication controls outside the tagged source checkout
        run: |
          mkdir -p "$RUNNER_TEMP/considered-publication-tools"
          cp scripts/*.mjs "$RUNNER_TEMP/considered-publication-tools/"
          cp -R .github/workflows "$RUNNER_TEMP/considered-publication-tools/workflows"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Refuse a tag changed since Windows validation
        env:
          TESTED_SHA: ${{ needs.windows-package.outputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-candidate
      - name: Verify package publishing credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          missing=0
          for credential in HOMEBREW_TAP_TOKEN WINGET_TOKEN; do
            if [ -z "${!credential}" ]; then
              echo "::error::Configure $credential before releasing; see RELEASING.md."
              missing=1
            fi
          done
          exit "$missing"
      - name: Test
        run: go test ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test publication verifier
        env:
          PUBLICATION_WORKFLOW_DIRECTORY: ${{ runner.temp }}/considered-publication-tools/workflows
        run: node --test "$RUNNER_TEMP"/considered-publication-tools/*.test.mjs
      - name: Refuse to overwrite an already-published release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/considered-publication-tools/verify-publication.mjs" --preflight
      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - name: Verify downstream publication before exposing the release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: node "$RUNNER_TEMP/considered-publication-tools/verify-publication.mjs"
      - name: Require published Windows artifacts to match the tested candidate
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node "$RUNNER_TEMP/considered-publication-tools/windows-candidate.mjs"
          verify dist "$RUNNER_TEMP/windows-candidate" "$RELEASE_TAG"
      - name: Download this run's native Windows success records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-evidence-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-checklist-evidence
      - name: Complete supported WinGet checklist claims and link evidence
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: >-
          node "$RUNNER_TEMP/considered-publication-tools/update-winget-checklist.mjs"
          "$RUNNER_TEMP/windows-candidate" "$RUNNER_TEMP/windows-checklist-evidence"
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo quitepicky/considered --draft=false
  report-failure:
    needs: [windows-package, release]
    if: ${{ always() && (needs.windows-package.result == 'failure' || needs.release.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Escalate failed Windows gate or publication to Garden
        env:
          GARDEN_PUBLICATION_KEY: ${{ secrets.GARDEN_PUBLICATION_KEY }}
          PUBLICATION_FAILURE: Considered release workflow failed; inspect this run and repair the existing tag before publishing.
        run: node scripts/publication-health.mjs

name: Publication health
on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
permissions:
  # GitHub hides draft releases from read-only tokens. The monitor must see a
  # failed draft rather than incorrectly clearing attention for an older release.
  contents: write
concurrency:
  group: publication-health
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check publication and maintain Garden attention
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GARDEN_PUBLICATION_KEY: ${{ secrets.GARDEN_PUBLICATION_KEY }}
        run: node scripts/publication-health.mjs

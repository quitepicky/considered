name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-package:
    uses: ./.github/workflows/windows-package.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go build -o bin/considered ./cmd/considered
          go build -o bin/considered-scc ./cmd/considered-scc

      - name: Considered self-check
        run: |
          PATH="${GITHUB_WORKSPACE}/bin:${PATH}" bin/considered check

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Test publication verification
        run: node --test scripts/*.test.mjs

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check
